# Supabase local development configuration
# Docs: https://supabase.com/docs/guides/cli/config
project_id = "rb-car-rental"

[db]
# Apply the migrations in supabase/migrations on `supabase db reset` / `push`.
major_version = 15

# Password for the local `postgres` role.
# IMPORTANT: never commit real secrets — keep this for local only.
port = 54322
shadow_port = 54320

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false

[storage]
enabled = true
file_size_limit = "5MiB"

[storage.buckets.car-images]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp", "image/avif"]

[realtime]
enabled = false